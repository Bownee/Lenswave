version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      proton:
        patterns: ["me.proton.*"]
      android-build:
        patterns: ["com.android.*", "org.jetbrains.kotlin.*", "com.google.devtools.ksp"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
