name: Set up Android build environment
description: Installs the pinned JDK, Gradle, and Android SDK packages every job needs. Run after actions/checkout.

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: temurin
        java-version-file: .github/toolchain/java-version

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      with:
        # Pull request pushes save their cache too, so the next push to the same branch reuses
        # dependency transforms and unchanged task outputs instead of rebuilding from scratch.
        cache-read-only: false
        add-job-summary: on-failure
        # The default on-success cleanup provisions a second Gradle distribution and spends ~40 s
        # per job pruning the user home; the 10 GiB repository cache already evicts stale entries.
        cache-cleanup: never

    - name: Tune Gradle for the CI runner
      shell: bash
      run: |
        # Runner-only overrides; gradle.properties in the repository stays sized for laptops.
        # The hosted runner has 16 GiB, and R8 and the Kotlin compiler are the memory-hungry
        # steps. The configuration cache is disabled because nothing persists the project-local
        # cache directory between jobs, so every invocation would only pay to store it.
        mkdir -p ~/.gradle
        cat >> ~/.gradle/gradle.properties <<'PROPS'
        org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8
        kotlin.daemon.jvmargs=-Xmx3g -XX:+UseParallelGC
        org.gradle.configuration-cache=false
        PROPS
        chmod +x gradlew scripts/*.sh

    - name: Locate pinned Android SDK packages
      id: sdk
      shell: bash
      run: |
        # "platforms;android-36" lives at $ANDROID_SDK_ROOT/platforms/android-36, and so on.
        test -d "$ANDROID_SDK_ROOT"
        {
          echo 'paths<<PATHS'
          sed 's#;#/#g' .github/toolchain/android-sdk-packages | sed "s#^#$ANDROID_SDK_ROOT/#"
          echo 'PATHS'
        } >> "$GITHUB_OUTPUT"

    # Downloading the packages from Google usually takes ~5 s but has taken up to nine minutes
    # in a single job, so the installed directories are cached against the pinned package list.
    - name: Restore Android SDK packages
      id: sdk-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.sdk.outputs.paths }}
        key: android-sdk-v1-${{ runner.os }}-${{ hashFiles('.github/toolchain/android-sdk-packages') }}

    - name: Install exact Android SDK packages
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set +o pipefail
        # shellcheck disable=SC2046
        yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
          $(tr '\n' ' ' < .github/toolchain/android-sdk-packages) >/dev/null
        set -o pipefail
