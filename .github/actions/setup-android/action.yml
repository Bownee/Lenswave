name: Set up Android build environment
description: Installs the pinned JDK, Gradle, and Android SDK packages every job needs. Run after actions/checkout.

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: temurin
        java-version-file: .github/toolchain/java-version

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      with:
        # Pull request pushes save their cache too, so the next push to the same branch reuses
        # dependency transforms and unchanged task outputs instead of rebuilding from scratch.
        cache-read-only: false
        add-job-summary: on-failure

    - name: Tune Gradle for the CI runner
      shell: bash
      run: |
        # Runner-only overrides; gradle.properties in the repository stays sized for laptops.
        # The hosted runner has 16 GiB, and R8 and the Kotlin compiler are the memory-hungry
        # steps. The configuration cache is disabled because nothing persists the project-local
        # cache directory between jobs, so every invocation would only pay to store it.
        mkdir -p ~/.gradle
        cat >> ~/.gradle/gradle.properties <<'PROPS'
        org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8
        kotlin.daemon.jvmargs=-Xmx3g -XX:+UseParallelGC
        org.gradle.configuration-cache=false
        PROPS

    - name: Install exact Android SDK packages
      shell: bash
      run: |
        set +o pipefail
        # shellcheck disable=SC2046
        yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
          $(tr '\n' ' ' < .github/toolchain/android-sdk-packages) >/dev/null
        set -o pipefail
        chmod +x gradlew scripts/*.sh
