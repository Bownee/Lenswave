name: Verify

# Shared by the CI and release workflows so both gate on exactly the same checks.
#
# Every variant is compiled from scratch (debug for unit tests, release for R8), so the checks
# share nothing but the dependency cache. They run as separate jobs so the wall clock is the
# slowest one rather than the sum.
on:
  workflow_call:
    inputs:
      assemble-debug:
        description: Also build the debug APK and attach it to the evidence.
        type: boolean
        default: false
      fetch-depth:
        description: Git history depth for the checkout.
        type: string
        default: "1"
      upload-name:
        description: Prefix of the evidence artifacts.
        type: string
        required: true
    outputs:
      version_name:
        description: VERSION_NAME from version.properties.
        value: ${{ jobs.release.outputs.version_name }}

jobs:
  tests:
    name: Style, unit tests, and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false

      - name: Set up Android build environment
        uses: ./.github/actions/setup-android

      - name: Style, unit tests, and coverage
        run: ./gradlew ktlintCheck testDebugUnitTest jacocoDebugCoverageVerification --stacktrace

      # Shares compileDebugKotlin with the unit tests, so this only adds dexing and packaging.
      - name: Build debug APK
        if: inputs.assemble-debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare evidence
        if: always()
        shell: bash
        run: |
          mkdir -p dist reports
          version="$(scripts/app-version.sh | grep '^version_name=' | cut -d= -f2-)"
          if [ -f app/build/outputs/apk/debug/app-arm64-v8a-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "dist/Lenswave-v$version-arm64-v8a-debug.apk"
          fi
          cp -r app/build/reports/jacoco reports/coverage 2>/dev/null || true
          cp -r app/build/test-results reports/unit-test-results 2>/dev/null || true
          find reports -maxdepth 2 -type d | sort

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.upload-name }}-tests
          path: |
            dist/*.apk
            reports/**
          if-no-files-found: error
          retention-days: 30

  lint:
    name: Android lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false

      - name: Set up Android build environment
        uses: ./.github/actions/setup-android

      # There are no variant-specific source sets, so lintRelease would repeat lintDebug; the
      # release-only fatal checks still run as lintVitalRelease inside assembleRelease.
      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint findings to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: android-lint

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.upload-name }}-lint
          path: app/build/reports/lint-results-*.html
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release build and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.app_version.outputs.version_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false

      - name: Set up Android build environment
        uses: ./.github/actions/setup-android

      - name: Read app version
        id: app_version
        shell: bash
        run: scripts/app-version.sh >> "$GITHUB_OUTPUT"

      - name: Build release variant and SBOM
        run: ./gradlew assembleRelease verifySbomLicenses --stacktrace

      - name: Check release APK size budget
        shell: bash
        run: |
          mkdir -p reports
          scripts/check-apk-size.sh app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk \
            | tee reports/apk-sizes.txt

      - name: Prepare evidence
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          cp build/reports/cyclonedx/bom.* reports/ 2>/dev/null || true
          ls reports

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.upload-name }}-release
          path: reports/**
          if-no-files-found: error
          retention-days: 30
