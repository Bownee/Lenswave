name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
    with:
      assemble-debug: true
      # The R8 build is the slowest verify job and no pull-request check consumes it; pushes to
      # main still build it, and release.yml re-runs the full set before anything is signed.
      build-release: ${{ github.event_name != 'pull_request' }}
      upload-name: lenswave-ci-${{ github.sha }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: write

  # Branch protection requires a check with exactly this name. Jobs called through a reusable
  # workflow report as "Verify / <job>", so this gate carries the required name and only runs
  # (and therefore only reports) when every verify job succeeded.
  gate:
    name: Test, lint, and build all runtime modes
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm the verify job passed
        run: echo "Verify passed for ${{ github.sha }}"

  instrumentation:
    name: API 29 device contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Android build environment
        uses: ./.github/actions/setup-android

      - name: Free emulator disk space
        shell: bash
        run: |
          # The NDK and CMake are not needed and free several gigabytes for the system image.
          test -d "$ANDROID_SDK_ROOT"
          sudo rm -rf -- "$ANDROID_SDK_ROOT/ndk" "$ANDROID_SDK_ROOT/cmake"
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # android-emulator-runner installs the platform and system image with sdkmanager on every
      # run (~30 s from Google); restoring the installed directories first makes that a no-op.
      - name: Locate the Android SDK
        id: sdk
        shell: bash
        run: |
          test -d "$ANDROID_SDK_ROOT"
          echo "root=$ANDROID_SDK_ROOT" >> "$GITHUB_OUTPUT"

      - name: Restore API 29 emulator packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            */build/reports/androidTests/**
            */build/outputs/androidTest-results/**
|
            ${{ steps.sdk.outputs.root }}/platforms/android-29
            ${{ steps.sdk.outputs.root }}/system-images/android-29/default/x86_64
          key: emulator-packages-api29-default-x86_64-v1

      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api29-x86_64-pixel2-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          cores: 2
          disk-size: 2G
          force-avd-creation: false
          emulator-options: -no-window -gpu software -noaudio -no-boot-anim -camera-back none
          script: echo "Generated AVD snapshot for caching."

      # APKs are compiled before the emulator boots so it is not sitting idle through the build,
      # and the connected tasks below find them up to date.
      - name: Build debug device-test APKs
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest \
            -Plenswave.includeX86TestAbi=true --stacktrace

      # The R8-optimised variant is a full second build and its contract is only exercised by one
      # instrumented test, so pull requests skip it; every push to main and every release tag still
      # runs it (release.yml checks the same contract while packaging).
      - name: Build minified device-test APKs
        if: github.event_name != 'pull_request'
        run: |
          ./gradlew assembleMinified assembleMinifiedAndroidTest \
            -Plenswave.instrumentationBuildType=minified -Plenswave.includeX86TestAbi=true --stacktrace

      - name: Verify minified instrumentation contract
        if: github.event_name != 'pull_request'
        shell: bash
        run: scripts/verify-minified-contract.sh app/build/outputs/mapping/minified

      - name: Run minimum-SDK device tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          cores: 2
          disk-size: 2G
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu software -no-snapshot-save -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew connectedDebugAndroidTest -Plenswave.includeX86TestAbi=true --stacktrace
            # The runner executes each script line in its own shell, so this must stay on one line.
            [ "$RUN_MINIFIED_CONTRACT" != "true" ] || ./gradlew connectedMinifiedAndroidTest -Plenswave.instrumentationBuildType=minified -Plenswave.includeX86TestAbi=true -Pandroid.testInstrumentationRunnerArguments.class=com.bownee.lenswave.proton.ProtonSdkJniContractInstrumentedTest --stacktrace
        env:
          RUN_MINIFIED_CONTRACT: ${{ github.event_name != 'pull_request' }}

      - name: Upload device-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: device-tests-${{ github.sha }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 30
