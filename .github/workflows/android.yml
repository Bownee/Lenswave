name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
    with:
      assemble-debug: true
      upload-name: lenswave-ci-${{ github.sha }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: write

  # Branch protection requires a check with exactly this name. A job called through a reusable
  # workflow reports as "Verify / verify", so this gate carries the required name and only runs
  # (and therefore only reports) when the verify job succeeded.
  gate:
    name: Test, lint, and build all runtime modes
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm the verify job passed
        run: echo "Verify passed for ${{ github.sha }}"

  instrumentation:
    name: API 29 device contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Android build environment
        uses: ./.github/actions/setup-android

      - name: Free emulator disk space
        shell: bash
        run: |
          # The NDK and CMake are not needed and free several gigabytes for the system image.
          test -d "$ANDROID_SDK_ROOT"
          sudo rm -rf -- "$ANDROID_SDK_ROOT/ndk" "$ANDROID_SDK_ROOT/cmake"
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api29-x86_64-pixel2-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          cores: 2
          disk-size: 2G
          force-avd-creation: false
          emulator-options: -no-window -gpu software -noaudio -no-boot-anim -camera-back none
          script: echo "Generated AVD snapshot for caching."

      - name: Run minimum-SDK device tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          cores: 2
          disk-size: 2G
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu software -no-snapshot-save -noaudio -no-boot-anim -camera-back none
          script: |
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest -Plenswave.includeX86TestAbi=true --stacktrace
            ./gradlew connectedMinifiedAndroidTest -Plenswave.instrumentationBuildType=minified -Plenswave.includeX86TestAbi=true -Pandroid.testInstrumentationRunnerArguments.class=com.bownee.lenswave.proton.ProtonSdkJniContractInstrumentedTest --stacktrace

      - name: Upload device-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: device-tests-${{ github.sha }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 30
