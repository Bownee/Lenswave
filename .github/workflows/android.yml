name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
    with:
      assemble-debug: true
      # The R8 build is the slowest verify job and no pull-request check consumes it; pushes to
      # main still build it, and release.yml re-runs the full set before anything is signed.
      build-release: ${{ github.event_name != 'pull_request' }}
      upload-name: lenswave-ci-${{ github.sha }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: write

  # Branch protection requires a check with exactly this name. Jobs called through a reusable
  # workflow report as "Verify / <job>", so this gate carries the required name and only runs
  # (and therefore only reports) when every verify job succeeded.
  gate:
    name: Test, lint, and build all runtime modes
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm the verify job passed
        run: echo "Verify passed for ${{ github.sha }}"

  instrumentation:
    name: API 29 device contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Android build environment
        uses: ./.github/actions/setup-android

      - name: Free emulator disk space
        shell: bash
        run: |
          # The NDK and CMake are not needed and free several gigabytes for the system image.
          test -d "$ANDROID_SDK_ROOT"
          sudo rm -rf -- "$ANDROID_SDK_ROOT/ndk" "$ANDROID_SDK_ROOT/cmake"
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Installing the platform and system image with sdkmanager takes ~30 s from Google;
      # restoring the installed directories first makes that a no-op.
      - name: Locate the Android SDK
        id: sdk
        shell: bash
        run: |
          test -d "$ANDROID_SDK_ROOT"
          echo "root=$ANDROID_SDK_ROOT" >> "$GITHUB_OUTPUT"

      - name: Restore API 29 emulator packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.sdk.outputs.root }}/emulator
            ${{ steps.sdk.outputs.root }}/platforms/android-29
            ${{ steps.sdk.outputs.root }}/system-images/android-29/default/x86_64
          # The runner image ships no emulator package; caching it pins the version between runs.
          # Bump the suffix to pick up a newer emulator.
          key: emulator-packages-api29-default-x86_64-v2

      # The emulator is started here, before the APK build, so its boot overlaps the Gradle work
      # instead of following it. The AVD is created fresh each run: a cached snapshot never
      # survived the emulator updates the previous runner action performed, and boot is ~25 s.
      - name: Start the API 29 emulator
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          set +o pipefail
          yes | "$tools/sdkmanager" --licenses >/dev/null 2>&1 || true
          # A no-op when the cache restored the packages above.
          yes | "$tools/sdkmanager" emulator "platforms;android-29" "system-images;android-29;default;x86_64" >/dev/null
          set -o pipefail
          echo no | "$tools/avdmanager" create avd --force --name test \
            --package "system-images;android-29;default;x86_64" --device pixel_2 >/dev/null
          printf 'hw.cpu.ncore=2\ndisk.dataPartition.size=2G\n' >> ~/.android/avd/test.avd/config.ini
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" -avd test -port 5554 \
            -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo "Emulator starting (pid $!)"

      # The APKs build while the emulator boots; the connected tasks below find them up to date.
      - name: Build debug device-test APKs
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest \
            -Plenswave.includeX86TestAbi=true --stacktrace

      # The R8-optimised variant is a full second build and its contract is only exercised by one
      # instrumented test, so pull requests skip it; every push to main and every release tag still
      # runs it (release.yml checks the same contract while packaging).
      - name: Build minified device-test APKs
        if: github.event_name != 'pull_request'
        run: |
          ./gradlew assembleMinified assembleMinifiedAndroidTest \
            -Plenswave.instrumentationBuildType=minified -Plenswave.includeX86TestAbi=true --stacktrace

      - name: Verify minified instrumentation contract
        if: github.event_name != 'pull_request'
        shell: bash
        run: scripts/verify-minified-contract.sh app/build/outputs/mapping/minified

      - name: Wait for the emulator to boot
        shell: bash
        run: |
          set -euo pipefail
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          deadline=$((SECONDS + 600))
          "$adb" wait-for-device
          until [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Emulator did not boot within 10 minutes" >&2
              tail -n 50 "$RUNNER_TEMP/emulator.log" >&2
              exit 1
            fi
            sleep 2
          done
          echo "Boot completed after ${SECONDS}s of waiting"
          # Animations only slow the activity tests down.
          "$adb" shell settings put global window_animation_scale 0
          "$adb" shell settings put global transition_animation_scale 0
          "$adb" shell settings put global animator_duration_scale 0

      - name: Run minimum-SDK device tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew connectedDebugAndroidTest -Plenswave.includeX86TestAbi=true --stacktrace
          if [ "$RUN_MINIFIED_CONTRACT" = "true" ]; then
            ./gradlew connectedMinifiedAndroidTest \
              -Plenswave.instrumentationBuildType=minified -Plenswave.includeX86TestAbi=true \
              -Pandroid.testInstrumentationRunnerArguments.class=com.bownee.lenswave.proton.ProtonSdkJniContractInstrumentedTest \
              --stacktrace
          fi
        env:
          RUN_MINIFIED_CONTRACT: ${{ github.event_name != 'pull_request' }}

      - name: Stop the emulator
        if: always()
        shell: bash
        run: |
          "$ANDROID_SDK_ROOT/platform-tools/adb" -s emulator-5554 emu kill >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/emulator.log" app/build/emulator.log 2>/dev/null || true

      - name: Upload device-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: device-tests-${{ github.sha }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/emulator.log
          if-no-files-found: warn
          retention-days: 30
