name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate reviewed unsigned release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version_name: ${{ steps.app_version.outputs.version_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21.0.8
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21.0.8+9.0.LTS"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Install exact Android SDK tools
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          set -o pipefail

      - name: Verify release provenance and version
        id: app_version
        shell: bash
        run: |
          git fetch --no-tags origin main
          test "$(git cat-file -t "$GITHUB_REF")" = tag || {
            echo "Release tags must be annotated." >&2
            exit 1
          }
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)" || {
            echo "Release tag must point at the reviewed tip of main." >&2
            exit 1
          }
          version_name="$(grep '^VERSION_NAME=' version.properties | cut -d= -f2-)"
          version_code="$(grep '^VERSION_CODE=' version.properties | cut -d= -f2-)"
          test "$GITHUB_REF_NAME" = "v$version_name" || {
            echo "Tag $GITHUB_REF_NAME does not match version.properties (v$version_name)." >&2
            exit 1
          }
          test -n "$version_code"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Test, lint, inventory, and build without signing secrets
        run: |
          chmod +x gradlew
          ./gradlew \
            testDebugUnitTest \
            jacocoDebugCoverageVerification \
            assembleRelease verifySbomLicenses \
            --no-configuration-cache \
            --stacktrace
          # AGP 9.3/Kotlin FIR lint analysis can race when debug and release UAST run concurrently.
          ./gradlew lintDebug lintRelease \
            --max-workers=1 \
            --no-configuration-cache \
            --stacktrace

      - name: Prepare unsigned artifacts
        shell: bash
        run: |
          mkdir -p unsigned metadata
          maximum_bytes=$((65 * 1024 * 1024))
          for abi in arm64-v8a; do
            source_apk="app/build/outputs/apk/release/app-$abi-release-unsigned.apk"
            apk_bytes="$(stat -c%s "$source_apk")"
            printf '%s %s bytes\n' "$abi" "$apk_bytes" | tee -a metadata/apk-sizes.txt
            test "$apk_bytes" -le "$maximum_bytes" || {
              echo "$abi release APK exceeds the 65 MiB budget." >&2
              exit 1
            }
            cp \
              "$source_apk" \
              "unsigned/Lenswave-v${{ steps.app_version.outputs.version_name }}-$abi-unsigned.apk"
          done
          cp build/reports/cyclonedx/bom.json metadata/Lenswave.cdx.json
          cp build/reports/cyclonedx/bom.xml metadata/Lenswave.cdx.xml
          cp LICENSE metadata/
          git archive \
            --format=tar.gz \
            --prefix="Lenswave-v${{ steps.app_version.outputs.version_name }}/" \
            --output="metadata/Lenswave-source-v${{ steps.app_version.outputs.version_name }}.tar.gz" \
            "$GITHUB_SHA"

      - name: Upload verified unsigned release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-release-${{ github.sha }}
          path: |
            unsigned/*.apk
            metadata/*
          if-no-files-found: error
          retention-days: 7

  sign_and_publish:
    name: Sign in protected environment and publish
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-signing
    permissions:
      contents: write

    steps:
      - name: Download verified unsigned release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unsigned-release-${{ github.sha }}
          path: input

      - name: Install exact Android signing tools
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" >/dev/null
          set -o pipefail

      - name: Sign and verify ABI APKs
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LENSWAVE_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LENSWAVE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LENSWAVE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LENSWAVE_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          key_file="$RUNNER_TEMP/lenswave-release.p12"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_file"
          mkdir -p dist
          for abi in arm64-v8a; do
            unsigned="input/unsigned/Lenswave-v${{ needs.validate.outputs.version_name }}-$abi-unsigned.apk"
            signed="dist/Lenswave-v${{ needs.validate.outputs.version_name }}-$abi.apk"
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
              --ks "$key_file" \
              --ks-pass env:STORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              --out "$signed" \
              "$unsigned"
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify \
              --verbose --print-certs "$signed"
            (cd dist && sha256sum "$(basename "$signed")" > "$(basename "$signed").sha256")
          done
          cp input/metadata/* dist/

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Lenswave ${{ needs.validate.outputs.version_name }}"
