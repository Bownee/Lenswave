name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provenance:
    name: Verify tag provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release provenance and version
        shell: bash
        run: |
          git fetch --no-tags origin main
          test "$(git cat-file -t "$GITHUB_REF")" = tag || {
            echo "Release tags must be annotated." >&2
            exit 1
          }
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)" || {
            echo "Release tag must point at the reviewed tip of main." >&2
            exit 1
          }
          chmod +x scripts/app-version.sh
          version_name="$(scripts/app-version.sh | grep '^version_name=' | cut -d= -f2-)"
          test "$GITHUB_REF_NAME" = "v$version_name" || {
            echo "Tag $GITHUB_REF_NAME does not match version.properties (v$version_name)." >&2
            exit 1
          }

  validate:
    name: Validate reviewed unsigned release
    needs: provenance
    uses: ./.github/workflows/verify.yml
    with:
      assemble-debug: true
      upload-name: release-verify-${{ github.sha }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: write

  package:
    name: Package unsigned release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Android build environment
        uses: ./.github/actions/setup-android

      - name: Build unsigned release and SBOM
        run: |
          chmod +x gradlew scripts/*.sh
          ./gradlew assembleRelease verifySbomLicenses --no-configuration-cache --stacktrace

      # Pull-request CI skips the R8-optimised instrumentation build, so a release re-checks that
      # R8 kept every symbol the minified runtime and Proton's native bridge rely on.
      - name: Verify minified instrumentation contract
        shell: bash
        run: |
          ./gradlew assembleMinified -Plenswave.instrumentationBuildType=minified --stacktrace
          scripts/verify-minified-contract.sh app/build/outputs/mapping/minified

      - name: Prepare unsigned artifacts
        shell: bash
        run: |
          version="${{ needs.validate.outputs.version_name }}"
          mkdir -p unsigned metadata
          scripts/check-apk-size.sh app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk \
            | tee metadata/apk-sizes.txt
          cp app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk \
            "unsigned/Lenswave-v$version-arm64-v8a-unsigned.apk"
          cp build/reports/cyclonedx/bom.json metadata/Lenswave.cdx.json
          cp build/reports/cyclonedx/bom.xml metadata/Lenswave.cdx.xml
          cp LICENSE metadata/
          git archive \
            --format=tar.gz \
            --prefix="Lenswave-v$version/" \
            --output="metadata/Lenswave-source-v$version.tar.gz" \
            "$GITHUB_SHA"
          (cd unsigned && sha256sum ./*.apk > ../metadata/unsigned-sha256.txt)

      - name: Upload verified unsigned release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-release-${{ github.sha }}
          path: |
            unsigned/*.apk
            metadata/*
          if-no-files-found: error
          retention-days: 7

  sign_and_publish:
    name: Sign in protected environment and publish
    needs: [validate, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-signing
    permissions:
      contents: write

    steps:
      - name: Download verified unsigned release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unsigned-release-${{ github.sha }}
          path: input

      - name: Verify the artifact is the one the package job produced
        shell: bash
        run: |
          cd input/unsigned
          sha256sum -c ../metadata/unsigned-sha256.txt

      - name: Install exact Android signing tools
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" >/dev/null
          set -o pipefail

      - name: Sign and verify ABI APKs
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LENSWAVE_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LENSWAVE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LENSWAVE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LENSWAVE_SIGNING_KEY_PASSWORD }}
          VERSION_NAME: ${{ needs.validate.outputs.version_name }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          apksigner="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          key_file="$RUNNER_TEMP/lenswave-release.p12"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_file"
          mkdir -p dist
          unsigned="input/unsigned/Lenswave-v$VERSION_NAME-arm64-v8a-unsigned.apk"
          signed="dist/Lenswave-v$VERSION_NAME-arm64-v8a.apk"
          "$apksigner" sign \
            --ks "$key_file" \
            --ks-pass env:STORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$signed" \
            "$unsigned"
          "$apksigner" verify --verbose --print-certs "$signed"
          (cd dist && sha256sum "$(basename "$signed")" > "$(basename "$signed").sha256")
          cp input/metadata/* dist/
          rm -f dist/unsigned-sha256.txt

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Lenswave ${{ needs.validate.outputs.version_name }}"
