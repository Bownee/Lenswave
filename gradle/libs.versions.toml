[versions]
# Build toolchain
agp = "9.3.1"
ksp = "2.3.11"
hilt = "2.60.1"
kotlin-compose-plugin = "2.4.10"
room = "2.8.4"
cyclonedx = "3.4.1"
jacoco = "0.8.13"
ktlintCli = "1.8.0"
ktlintGradle = "14.2.0"

# AndroidX and Google
activity = "1.13.0"
compose-material3 = "1.3.1"
exifinterface = "1.4.2"
fragment = "1.9.0"
lifecycle = "2.10.0"
material = "1.12.0"
media3 = "1.11.0"
work = "2.10.0"

# Storage and networking
sqlcipher = "4.6.1"

# Proton
proton-core = "36.7.0"
proton-drive-sdk = "0.24.0-rust"

# Testing
androidx-test-core = "1.7.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-orchestrator = "1.6.1"
androidx-test-runner = "1.7.0"
androidx-swiperefreshlayout = "1.2.0"
junit = "4.13.2"
kotlinx-coroutines = "1.10.2"

[libraries]
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "androidx-swiperefreshlayout" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
sqlcipher = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }

proton-drive-sdk = { module = "me.proton.drive:sdk", version.ref = "proton-drive-sdk" }
proton-core-account = { module = "me.proton.core:account", version.ref = "proton-core" }
proton-core-account-manager = { module = "me.proton.core:account-manager", version.ref = "proton-core" }
proton-core-account-recovery = { module = "me.proton.core:account-recovery", version.ref = "proton-core" }
proton-core-auth = { module = "me.proton.core:auth", version.ref = "proton-core" }
proton-core-auth-fido = { module = "me.proton.core:auth-fido", version.ref = "proton-core" }
proton-core-biometric = { module = "me.proton.core:biometric", version.ref = "proton-core" }
proton-core-challenge = { module = "me.proton.core:challenge", version.ref = "proton-core" }
proton-core-country = { module = "me.proton.core:country", version.ref = "proton-core" }
proton-core-crypto = { module = "me.proton.core:crypto", version.ref = "proton-core" }
proton-core-crypto-validator = { module = "me.proton.core:crypto-validator", version.ref = "proton-core" }
proton-core-data-room = { module = "me.proton.core:data-room", version.ref = "proton-core" }
proton-core-domain = { module = "me.proton.core:domain", version.ref = "proton-core" }
proton-core-event-manager = { module = "me.proton.core:event-manager", version.ref = "proton-core" }
proton-core-feature-flag = { module = "me.proton.core:feature-flag", version.ref = "proton-core" }
proton-core-human-verification = { module = "me.proton.core:human-verification", version.ref = "proton-core" }
proton-core-key = { module = "me.proton.core:key", version.ref = "proton-core" }
proton-core-key-transparency = { module = "me.proton.core:key-transparency", version.ref = "proton-core" }
proton-core-network = { module = "me.proton.core:network", version.ref = "proton-core" }
proton-core-notification = { module = "me.proton.core:notification", version.ref = "proton-core" }
proton-core-observability = { module = "me.proton.core:observability", version.ref = "proton-core" }
proton-core-pass-validator = { module = "me.proton.core:pass-validator", version.ref = "proton-core" }
proton-core-payment = { module = "me.proton.core:payment", version.ref = "proton-core" }
proton-core-plan = { module = "me.proton.core:plan", version.ref = "proton-core" }
proton-core-presentation-compose = { module = "me.proton.core:presentation-compose", version.ref = "proton-core" }
proton-core-proguard-rules = { module = "me.proton.core:proguard-rules", version.ref = "proton-core" }
proton-core-push = { module = "me.proton.core:push", version.ref = "proton-core" }
proton-core-telemetry = { module = "me.proton.core:telemetry", version.ref = "proton-core" }
proton-core-user = { module = "me.proton.core:user", version.ref = "proton-core" }
proton-core-user-recovery = { module = "me.proton.core:user-recovery", version.ref = "proton-core" }
proton-core-user-settings = { module = "me.proton.core:user-settings", version.ref = "proton-core" }
proton-core-util-android-dagger = { module = "me.proton.core:util-android-dagger", version.ref = "proton-core" }

androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-orchestrator = { module = "androidx.test:orchestrator", version.ref = "androidx-test-orchestrator" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

[bundles]
proton-core = [
    "proton-core-account",
    "proton-core-account-manager",
    "proton-core-account-recovery",
    "proton-core-auth",
    "proton-core-auth-fido",
    "proton-core-biometric",
    "proton-core-challenge",
    "proton-core-country",
    "proton-core-crypto",
    "proton-core-crypto-validator",
    "proton-core-data-room",
    "proton-core-domain",
    "proton-core-event-manager",
    "proton-core-feature-flag",
    "proton-core-human-verification",
    "proton-core-key",
    "proton-core-key-transparency",
    "proton-core-network",
    "proton-core-notification",
    "proton-core-observability",
    "proton-core-pass-validator",
    "proton-core-payment",
    "proton-core-plan",
    "proton-core-presentation-compose",
    "proton-core-proguard-rules",
    "proton-core-push",
    "proton-core-telemetry",
    "proton-core-user",
    "proton-core-user-recovery",
    "proton-core-user-settings",
    "proton-core-util-android-dagger",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
androidx-room = { id = "androidx.room", version.ref = "room" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin-compose-plugin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
